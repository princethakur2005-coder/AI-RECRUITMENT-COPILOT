[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
addopts = --strict-markers --maxfail=1 -q --cov=app --cov-report=term-missing
markers =
    integration: marks tests as integration
asyncio_mode = auto

# Parallel execution placeholder: use pytest-xdist and set -n auto when desired