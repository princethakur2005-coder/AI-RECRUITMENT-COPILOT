upstream backend_upstream {
  server backend:8000;
  keepalive 64;
}

upstream frontend_upstream {
  server frontend:3000;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:; frame-ancestors 'none'; base-uri 'self';" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  send_timeout 60s;

  # Optional rate limiting (placeholder, enable as needed)
  # limit_req zone=api_limit burst=40 nodelay;
  # limit_conn conn_limit 100;

  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location ^~ /api/ {
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://backend_upstream;
  }

  # Backward compatibility for existing non-prefixed backend routes
  location ~ ^/(auth|users|candidates|offers|dashboard|search|assistant|notes|orgs|jobs|interviews|resumes|applications)(/|$) {
    proxy_pass http://backend_upstream;
  }

  location ~ ^/(docs|redoc|openapi.json)$ {
    proxy_pass http://backend_upstream;
  }

  # Static assets proxied through frontend service with long-lived caching
  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    proxy_pass http://frontend_upstream;
  }

  # Explicit static path cache policy
  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    proxy_pass http://frontend_upstream;
  }

  # Frontend routing with SPA fallback
  location / {
    try_files $uri @frontend_spa;
  }

  location @frontend_spa {
    add_header Cache-Control "no-store" always;
    proxy_pass http://frontend_upstream/index.html;
  }
}
