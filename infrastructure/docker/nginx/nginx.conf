user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  reset_timedout_connection on;
  types_hash_max_size 2048;
  server_tokens off;

  client_max_body_size 25m;

  # Compression
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/x-javascript
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

  # Brotli (enable only if ngx_brotli module is available in the nginx image)
  # brotli on;
  # brotli_comp_level 5;
  # brotli_static on;
  # brotli_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  # Rate limit placeholders
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  include /etc/nginx/conf.d/*.conf;
}
